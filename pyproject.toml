[project]
name = "spyqbank"
version = "1.2.0"
description = "Διαχειριστής Τράπεζας Θεμάτων ΙΕΠ με Flet UI & Αυτόματη Εξαγωγή Θεμάτων-Απαντήσεων σε PDF"
authors = [
    { name = "Alekos", email = "alekos@program.gr" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.28.0",
    "requests>=2.31.0",
    "pypdf>=5.0.0",
    "reportlab>=4.0.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
]

[tool.flet.app]
path = "src"
